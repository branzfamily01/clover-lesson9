<script>

(()=>{
const data=window.LESSON9_DATA||[];
const app=document.getElementById('app'), stage=document.getElementById('stage');
const prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn'), resetBtn=document.getElementById('resetBtn');
const menuBtn=document.getElementById('menuBtn'), drawer=document.getElementById('drawer'), closeDrawer=document.getElementById('closeDrawer');
const qList=document.getElementById('questionList'), slideCounter=document.getElementById('slideCounter'), stepDots=document.getElementById('stepDots');
const rate=document.getElementById('rate'), rateValue=document.getElementById('rateValue'), voiceMode=document.getElementById('voiceMode'), toast=document.getElementById('toast');
let slideIndex=-2; // -2 cover, -1 guide, 0..39 questions, 40 ending
let step=0, revealed=false, voices=[];
const maxStep=5;
function esc(s=''){return s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]||c));}
function showToast(msg){toast.textContent=msg;toast.hidden=false;clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.hidden=true,1800)}
function loadVoices(){if(!('speechSynthesis' in window))return;voices=speechSynthesis.getVoices()||[]}
loadVoices(); if('speechSynthesis' in window) speechSynthesis.addEventListener?.('voiceschanged',loadVoices);
function pickVoice(){const mode=voiceMode.value; const english=voices.filter(v=>/^en[-_]/i.test(v.lang)); if(!english.length)return null; if(mode==='auto')return english.find(v=>/Samantha|Daniel|Google US English|Microsoft.*(Aria|Jenny|Guy)/i.test(v.name))||english[0]; return english.find(v=>v.lang.toLowerCase().startsWith(mode.toLowerCase()))||english[0];}
function speak(text){if(!text)return showToast('この段階では再生する英文がありません'); if(!('speechSynthesis' in window))return showToast('このブラウザは音声読み上げに対応していません'); speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=voiceMode.value==='auto'?'en-US':voiceMode.value; u.rate=Number(rate.value); const v=pickVoice(); if(v)u.voice=v; speechSynthesis.speak(u);}
function current(){return data[slideIndex]}
function labelForStep(s){return ['問題','正解','正解の根拠','誤答分析','和訳','Output'][s]||''}
function makeDots(){stepDots.innerHTML=''; if(slideIndex<0||slideIndex>=data.length)return; for(let i=0;i<=maxStep;i++){const d=document.createElement('span');d.className='step-dot'+(i<=step?' on':'');d.title=labelForStep(i);stepDots.appendChild(d)}}
function counterText(){if(slideIndex===-2)return 'START'; if(slideIndex===-1)return 'GUIDE'; if(slideIndex===data.length)return 'END'; return `${slideIndex+1} / ${data.length}`}
function renderCover(){stage.className='stage cover-stage clickable';stage.innerHTML=`<div class="intro"><div class="eyebrow">高校3年 / Clover</div><h1>Clover Lesson9</h1><p>問題を先に考え、クリックするたびに <b>正解 → 根拠 → 誤答分析 → 和訳 → Output</b> へ進む授業用デッキ。英文はブラウザ音声で再生できます。</p></div>`}
function renderGuide(){stage.className='stage clickable';stage.innerHTML=`<div class="topline"><span class="qno">授業の進め方</span><span class="section">1問30〜60秒</span></div><h1>答えより先に「切る根拠」を言わせる</h1><div class="guide-grid"><div class="guide-card"><b>① 問題</b><p>選択肢を見て、自分の答えを決める。</p></div><div class="guide-card"><b>② 正解・根拠</b><p>正答後、どの文法・語法が決め手か確認。</p></div><div class="guide-card"><b>③ 誤答分析</b><p>「意味が違う」だけでなく、品詞・語順・構文で切る。</p></div><div class="guide-card"><b>④ 和訳</b><p>正答を入れた文の意味を自然な日本語で確認。</p></div><div class="guide-card"><b>⑤ Output</b><p>日本語だけを見て英語を再生。音声で最終確認。</p></div><div class="guide-card"><b>操作</b><p>スライド本体クリック / Spaceで次段階。← →で問題移動。↺でその問題をリセット。</p></div></div>`}
function renderEnd(){stage.className='stage clickable';stage.innerHTML=`<div class="intro" style="color:var(--ink)"><div class="eyebrow">Clover Lesson9 COMPLETE</div><h1 style="color:var(--navy)">Final Check</h1><p style="color:#4b5a70">① 正解を言える　② 誤答を文法で切れる　③ 和訳できる　④ 日本語から核となる英語表現を再生できる。問題一覧から苦手な項目だけ戻って復習できます。</p><div class="output-actions"><button class="action-btn" type="button" data-action="open-menu">問題一覧を開く</button><button class="action-btn secondary" type="button" data-action="restart">最初から</button></div></div>`}
function renderQuestion(){const q=current(); if(!q)return; stage.className='stage clickable'; const norm=s=>String(s||'').replace(/^[①②③④⑤⑥⑦⑧]\s*/,'').trim(); const choices=q.choices.map(c=>`<span class="choice ${step>=1 && norm(c)===norm(q.answer)?'correct-choice':''}">${esc(c)}</span>`).join(''); let panel='';
 if(step===0){panel=`<div class="stage-panel"><div class="panel-label">考える</div><div class="method">まず自分で解答を決める。正解を当てるだけでなく、「他の選択肢を何のルールで切るか」まで考える。</div></div>`}
 if(step===1){panel=`<div class="stage-panel"><div class="panel-label answer">✓ 正解</div><div class="answer-main">${esc(q.answer)}</div>${q.completed?`<div class="completed">${esc(q.completed)}</div>`:''}<div class="output-actions">${q.answerAudio?'<button class="action-btn" type="button" data-action="speak-answer">🔊 正答英文</button>':''}</div></div>`}
 if(step===2){panel=`<div class="stage-panel"><div class="panel-label reason">● なぜ正解か</div><div class="method"><b>今回のポイント：</b> ${esc(q.focus)}</div><ul class="bullets">${q.correct.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="method"><b>見抜く順序：</b> ${esc(q.method)}</div></div>`}
 if(step===3){panel=`<div class="stage-panel"><div class="panel-label wrong">× なぜ他はダメか</div><div class="wrong-list">${q.wrong.map(x=>`<div class="wrong-item">${esc(x)}</div>`).join('')||'<div class="wrong-item">この形式では誤答選択肢ではなく、語順・構文の崩れやすい箇所を確認する。</div>'}</div></div>`}
 if(step===4){panel=`<div class="stage-panel"><div class="panel-label translation">訳 / 意味確認</div><div class="jp-translation">${esc(q.translation)}</div>${q.answerAudio?'<div class="output-actions"><button class="action-btn" type="button" data-action="speak-answer">🔊 英文を聞く</button></div>':''}</div>`}
 if(step===5){panel=`<div class="stage-panel"><div class="panel-label output">Output</div><div class="output-cue">${esc(q.translation)}</div><div class="method"><b>再利用する型：</b> ${esc((q.reuse||[]).join(' '))}</div><div class="output-actions">${q.answerAudio?'<button class="action-btn" type="button" data-action="speak-answer">🔊 音声で確認</button>':''}<button class="action-btn secondary" type="button" data-action="toggle-answer">英文を見る</button></div>${revealed?`<div class="hidden-answer">${esc(q.completed||q.answer)}</div>`:''}</div>`}
 const qAudio=q.questionAudio?'<button class="audio-btn" type="button" data-action="speak-question" title="問題文を読む">🔊</button>':'';
 stage.innerHTML=`<div class="topline"><span class="qno">${esc(q.key)}</span><span class="section">${esc(q.sectionName)}</span></div><h1>Question ${esc(q.key)}</h1><div class="question-card"><p class="question">${esc(q.question)}</p>${qAudio}${choices?`<div class="choice-grid">${choices}</div>`:''}</div><div class="content">${panel}</div><div class="stage-hint">${esc(labelForStep(step))}</div>`;
}
function render(){if('speechSynthesis' in window) window.speechSynthesis.cancel();revealed=false; if(slideIndex===-2)renderCover(); else if(slideIndex===-1)renderGuide(); else if(slideIndex===data.length)renderEnd(); else renderQuestion(); slideCounter.textContent=counterText();makeDots(); prevBtn.disabled=slideIndex===-2; nextBtn.setAttribute('aria-label', slideIndex>=0&&slideIndex<data.length&&step<maxStep?'次の段階':'次のスライド');}
function advance(){if(slideIndex<0){slideIndex++;step=0;render();return} if(slideIndex>=data.length){slideIndex=-2;step=0;render();return} if(step<maxStep){step++;renderQuestion();makeDots()}else{slideIndex++;step=0;render()}}
function backSlide(){if(slideIndex<=-2)return; slideIndex--;step=0;render()}
function nextSlide(){if(slideIndex<data.length){slideIndex++;step=0;render()}else{slideIndex=-2;step=0;render()}}
function resetStep(){step=0;revealed=false;render()}
function openMenu(){drawer.hidden=false;closeDrawer.focus()}
function closeMenu(){drawer.hidden=true;menuBtn.focus()}
function buildList(){qList.innerHTML=data.map((q,i)=>`<button class="jump-btn" type="button" data-jump="${i}">${esc(q.key)}<small>${esc(q.sectionName)}</small></button>`).join('')}
rate.addEventListener('input',()=>rateValue.textContent=Number(rate.value).toFixed(1));
prevBtn.addEventListener('click',e=>{e.stopPropagation();backSlide()}); nextBtn.addEventListener('click',e=>{e.stopPropagation();advance()}); resetBtn.addEventListener('click',e=>{e.stopPropagation();resetStep()}); menuBtn.addEventListener('click',e=>{e.stopPropagation();openMenu()}); closeDrawer.addEventListener('click',closeMenu); drawer.addEventListener('click',e=>{if(e.target===drawer)closeMenu()});
qList.addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(!b)return;slideIndex=Number(b.dataset.jump);step=0;drawer.hidden=true;render()});
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(b){const a=b.dataset.action;if(a==='speak-question')speak(current()?.questionAudio); if(a==='speak-answer')speak(current()?.answerAudio); if(a==='toggle-answer'){revealed=!revealed;renderQuestion()} if(a==='open-menu')openMenu(); if(a==='restart'){slideIndex=-2;step=0;render()} e.stopPropagation(); return} advance()});
app.addEventListener('keydown',e=>{if(drawer.hidden===false){if(e.key==='Escape')closeMenu();return} const tag=e.target.tagName;if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(tag))return; if(e.code==='Space'||e.key==='Enter'){e.preventDefault();advance()} else if(e.key==='ArrowRight'){e.preventDefault();nextSlide()} else if(e.key==='ArrowLeft'){e.preventDefault();backSlide()} else if(e.key.toLowerCase()==='r'){e.preventDefault();resetStep()} else if(e.key.toLowerCase()==='m'){e.preventDefault();openMenu()}});
buildList(); render(); app.focus();
})();

</script>

  .backup-english{font-size:25px;gap:7px 9px}
  .backup-phrase{padding:5px 8px}
  .backup-final{font-size:24px;padding:10px}
  .backup-help{font-size:16px}
}
</style>
<script>
(()=>{
  const stage=document.getElementById('stage');
  const toolbar=document.querySelector('.toolbar');
  const data=window.LESSON9_DATA||[];
  if(!stage||!toolbar||!data.length)return;

  const BACKUP_PHRASES={
    '5-(1)':['What is needed','to become a good teacher','is knowing','not only what to teach','but how to teach it.'],
    '5-(2)':['Don’t let the news','be disclosed','to any reporters','before the official announcement.'],
    '5-(3)':['Before you go','to a foreign country','where your language is not spoken,','you cannot realize','how inconvenient it is','to be unable','to make yourself understood.'],
    '5-(4)':['I had walked','less than a mile','when I began','feeling like going back home.'],
    '5-(5)':['We often don’t recognize','the value of the things we have','until we’ve lost them.'],
    '5-(6)':['Dolphins can learn','many complicated tricks','if trained','from an early age.'],
    '5-(7)':['Do to others','as you would have others','do to you.'],
    '5-(8)':['What impressed me most','is that Mother Teresa','devoted herself','to the people in the slum.']
  };

  const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const currentKey=()=>stage.querySelector('.qno')?.textContent?.trim()||'';
  const currentItem=()=>data.find(q=>q.key===currentKey());
  const phase=()=>stage.querySelector('.stage-hint')?.textContent?.trim()||'';
  let backupLevel=0;
  let backupKey='';
  let mapOpen=false;

  /* --- 全体地図 --- */
  const mapBtn=document.createElement('button');
  mapBtn.type='button';
  mapBtn.className='icon-btn map-toolbar-btn';
  mapBtn.textContent='全体地図';
  mapBtn.setAttribute('aria-label','Lesson9 全体地図');
  const menuBtn=document.getElementById('menuBtn');
  menuBtn?.insertAdjacentElement('afterend',mapBtn);

  const map=document.createElement('div');
  map.className='lesson-map';
  map.hidden=true;
  map.innerHTML='<div class="lesson-map-card" role="dialog" aria-modal="true" aria-label="Clover Lesson9 全体地図"><div class="lesson-map-head"><strong>Clover Lesson9｜全体地図</strong><button type="button" class="icon-btn" data-map-close>×</button></div><div class="lesson-map-body"></div></div>';
  document.body.appendChild(map);
  const mapBody=map.querySelector('.lesson-map-body');

  const groups=[];
  data.forEach((q,i)=>{
    let g=groups.find(x=>x.section===q.section);
    if(!g){g={section:q.section,name:q.sectionName,items:[]};groups.push(g)}
    g.items.push({q,i});
  });
  mapBody.innerHTML=groups.map(g=>'<section class="map-section"><div class="map-section-title"><span>Section '+esc(g.section)+'｜'+esc(g.name)+'</span><span class="map-count">'+g.items.length+'問</span></div><div class="map-links">'+g.items.map(({q,i})=>'<button type="button" class="map-link" data-map-jump="'+i+'">'+esc(q.key)+'<small>'+esc(q.focus||q.title||'')+'</small></button>').join('')+'</div></section>').join('');

  function openMap(){map.hidden=false;mapOpen=true;map.querySelector('[data-map-close]')?.focus()}
  function closeMap(){map.hidden=true;mapOpen=false;mapBtn.focus()}
  mapBtn.addEventListener('click',e=>{e.stopPropagation();openMap()});
  map.addEventListener('click',e=>{
    if(e.target===map||e.target.closest('[data-map-close]')){closeMap();return}
    const b=e.target.closest('[data-map-jump]');
    if(!b)return;
    const i=Number(b.dataset.mapJump);
    const original=document.querySelector('#questionList [data-jump="'+i+'"]');
    if(original){map.hidden=true;mapOpen=false;original.click()}
  });
  document.addEventListener('keydown',e=>{if(mapOpen&&e.key==='Escape'){e.preventDefault();closeMap()}},true);

  /* --- 解答以降は完成英文に差し替え --- */
  function syncCompletedSentence(){
    const q=currentItem();
    const p=phase();
    const isAnswer=!!q && ['正解','正解の根拠','誤答分析','和訳','Output'].includes(p);
    stage.dataset.answerPhase=isAnswer?'1':'0';
    stage.dataset.phase=p;
    if(!isAnswer||!q)return;
    const question=stage.querySelector('.question');
    if(question && q.completed && question.textContent!==q.completed){question.textContent=q.completed}
    const choices=stage.querySelector('.choice-grid');
    if(choices)choices.style.display='none';
    const audio=stage.querySelector('.question-card [data-action="speak-question"]');
    if(audio){audio.dataset.action='speak-answer';audio.title='完成英文を読む'}
  }

  /* --- Back Up Technique --- */
  function renderBackup(){
    const q=currentItem();
    const key=q?.key||'';
    const parts=BACKUP_PHRASES[key];
    if(!q||!parts||phase()!=='Output')return;
    const panel=stage.querySelector('.stage-panel');
    if(!panel)return;
    if(backupKey!==key){backupKey=key;backupLevel=0}
    backupLevel=Math.max(0,Math.min(backupLevel,parts.length));
    const mounted=panel.querySelector('[data-backup-mounted]');
    if(mounted && mounted.dataset.level===String(backupLevel))return;
    const allHidden=backupLevel===parts.length;
    const english=allHidden
      ? '<div class="backup-final">日本語だけを見て、英文を最初から言う</div>'
      : '<div class="backup-english">'+parts.map((part,i)=>{
          const hidden=i>=parts.length-backupLevel;
          return '<span class="backup-phrase'+(hidden?' masked':'')+'">'+esc(part)+'</span>';
        }).join('')+'</div>';
    panel.innerHTML='<div class="backup-screen" data-backup-mounted="1" data-level="'+backupLevel+'"><div class="backup-title-row"><div class="backup-title">Back Up Technique</div><div class="backup-progress">'+backupLevel+' / '+parts.length+' hidden</div></div><div class="backup-japanese">'+esc(q.translation)+'</div>'+english+'<div class="backup-help">画面をクリックするたびに、英文の後ろから <b>1フレーズずつ</b> 隠れます。全部隠れたら、日本語から全文を再生します。</div><div class="backup-controls"><button type="button" class="backup-undo" data-backup-undo>1つ戻す</button><button type="button" class="backup-reset" data-backup-reset>英文を全部戻す</button></div></div>';
  }

  /* Captureで元の「次の問題へ」を止め、隠す操作を優先 */
  stage.addEventListener('click',e=>{
    if(phase()!=='Output'||!BACKUP_PHRASES[currentKey()])return;
    const parts=BACKUP_PHRASES[currentKey()];
    const undo=e.target.closest('[data-backup-undo]');
    const reset=e.target.closest('[data-backup-reset]');
    if(undo||reset){
      e.preventDefault();e.stopImmediatePropagation();
      if(undo)backupLevel=Math.max(0,backupLevel-1);
      if(reset)backupLevel=0;
      renderBackup();
      return;
    }
    if(e.target.closest('button'))return;
    if(backupLevel<parts.length){
      e.preventDefault();e.stopImmediatePropagation();
      backupLevel++;
      renderBackup();
    }
    /* 全部隠れた後の次クリックだけは元のadvanceに渡し、次問題へ進む */
  },true);

  function sync(){
    syncCompletedSentence();
    if(phase()==='Output'&&BACKUP_PHRASES[currentKey()])renderBackup();
    else if(phase()!=='Output'){backupKey='';backupLevel=0}
  }
  let syncing=false;
  const observer=new MutationObserver(()=>{
    if(syncing9return;
    syncing=true;
    requestAnimationFrame(()=>{try{sync()}finally{syncing=false}});
  });
  observer.observe(stage,{childList:true,subtree:true,characterData:true});
  sync();
})();
</script>

</body>
</html>
