name: Build Clover Lesson9

on:
  push:
    paths:
      - 'payload.part00.b64'
      - 'payload.part01.b64'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index.html
        run: |
          cat payload.part00.b64 payload.part01.b64 | base64 --decode | gunzip > index.html
          test -s index.html
          grep -q '<title>Clover Lesson9</title>' index.html
          grep -q 'speechSynthesis' index.html
          grep -q 'drawer\[hidden\]' index.html
      - name: Commit app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy Clover Lesson9 interactive app' || exit 0
          git pull --rebase origin main
          git push
