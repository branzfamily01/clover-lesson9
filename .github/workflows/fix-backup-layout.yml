name: One-shot Lesson9 backup and layout fix

on:
  push:
    paths:
      - '.github/workflows/fix-backup-layout.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Lesson9 UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          fragment = Path('lesson9-fix-fragment.html')
          text = index.read_text(encoding='utf-8')
          marker = '<!-- clover-l9-backup-fit-fix-v2 -->'
          if marker not in text:
              block = fragment.read_text(encoding='utf-8')
              if '</body>' not in text:
                  raise SystemExit('index.html: </body> not found')
              text = text.replace('</body>', block + '\n</body>', 1)
              index.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix Back Up Technique and fit Lesson9 slides'
            git push
          fi
