name: Apply Clover Lesson9 classroom UI v3

on:
  push:
    paths:
      - '.github/workflows/apply-classroom-ui-v3.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Lesson9 classroom UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          for marker in ('<!-- clover-l9-backup-fit-fix-v2 -->', '<!-- clover-l9-classroom-ui-v3 -->'):
              if marker in text:
                  start = text.index(marker)
                  end = text.index('</body>', start)
                  text = text[:start] + text[end:]

          block = base64.b64decode('').decode('utf-8')
          text = text.replace('</body>', block + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Repair Lesson9 classroom answer, backup, map and typography'
            git push
          fi
