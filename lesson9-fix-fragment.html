/* Back Up Technique: 意味のかたまりを1つずつ後ろから隠す */
.backup-technique{margin-top:10px;padding:10px 12px;border-radius:14px;background:#fffaf0;border:1px solid #ead7ae}
.backup-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px;font-weight:950;color:#744b00;font-size:clamp(13px,1.12vw,16px)}
.backup-progress{font-size:11px;color:#7f7565;white-space:nowrap}
.backup-line{display:flex;flex-wrap:wrap;gap:7px 9px;align-items:center;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(16px,1.45vw,21px);line-height:1.3;font-weight:800}
.backup-phrase{display:inline-block;padding:4px 7px;border-radius:8px;background:#fff;border:1px solid #e6dccb}
.backup-phrase.masked{color:transparent;background:#273248;border-color:#273248;user-select:none;position:relative}
.backup-phrase.masked::after{content:' ';position:absolute;left:9px;right:9px;top:50%;height:3px;transform:translateY(-50%);background:rgba(255,255,255,.28);border-radius:99px}
.backup-jp-only{padding:9px 11px;border-radius:10px;background:#f5f1ff;border:1px solid #d9d0f1;font-weight:900;color:#5f4f92;font-size:clamp(14px,1.25vw,18px)}
.backup-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
@media (min-width:621px) and (max-height:700px){.backup-technique{margin-top:6px;padding:7px 9px}.backup-head{margin-bottom:4px}.backup-line{font-size:15px;gap:4px 6px}.backup-phrase{padding:3px 5px}.backup-actions{margin-top:5px}}
</style>
<script>
(()=>{
  const stage=document.getElementById('stage');
  if(!stage)return;

  const BACKUP_PHRASES={
    '5-(1)':['What is needed','to become a good teacher','is knowing','not only what to teach','but how to teach it.'],
    '5-(2)':['Don’t let the news','be disclosed','to any reporters','before the official announcement.'],
    '5-(3)':['Before you go','to a foreign country','where your language is not spoken,','you cannot realize','how inconvenient it is','to be unable','to make yourself understood.'],
    '5-(4)':['I had walked','less than a mile','when I began','feeling like going back home.'],
    '5-(5)':['We often don’t recognize','the value of the things we have','until we’ve lost them.'],
    '5-(6)':['Dolphins can learn','many complicated tricks','if trained','from an early age.'],
    '5-(7)':['Do to others','as you would have others','do to you.'],
    '5-(8)':['What impressed me most','is that Mother Teresa','devoted herself','to the people in the slum.']
  };

  let activeKey=null;
  let level=0;
  let wasOutput=false;
  let fitTimer=0;

  const escapeHtml=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const currentKey=()=>stage.querySelector('.qno')?.textContent?.trim()||'';
  const outputLabel=()=>[...stage.querySelectorAll('.panel-label')].find(el=>el.textContent.trim()==='Output');

  function renderBackup(box,key){
    const parts=BACKUP_PHRASES[key]||[];
    level=Math.max(0,Math.min(level,parts.length));
    const finalOnly=level===parts.length;
    let body='';
    if(finalOnly){
      body='<div class="backup-jp-only">日本語だけを見て、英文を最初から再生する</div>';
    }else{
      body='<div class="backup-line">'+parts.map((p,i)=>{
        const hidden=i>=parts.length-level;
        return '<span class="backup-phrase'+(hidden?' masked':'')+'">'+escapeHtml(p)+'</span>';
      }).join('')+'</div>';
    }
    const buttonLabel=finalOnly?'英文を全部戻す':'1フレーズ隠す';
    box.innerHTML='<div class="backup-head"><span>Back Up Technique</span><span class="backup-progress">'+level+' / '+parts.length+' hidden</span></div>'+body+'<div class="backup-actions"><button class="action-btn secondary" type="button" data-backup-action="next">'+buttonLabel+'</button><span class="backup-progress">後ろの意味のかたまりから1つずつ隠します</span></div>';
    scheduleFit();
  }

  function syncBackup(){
    const label=outputLabel();
    const key=currentKey();
    const eligible=!!label && !!BACKUP_PHRASES[key];
    if(!eligible){
      wasOutput=false;
      activeKey=null;
      scheduleFit();
      return;
    }

    if(!wasOutput || activeKey!==key){
      activeKey=key;
      level=0;
      wasOutput=true;
    }

    const panel=label.closest('.stage-panel');
    if(!panel)return;
    const oldToggle=panel.querySelector('[data-action="toggle-answer"]');
    if(oldToggle)oldToggle.style.display='none';
    const oldHidden=panel.querySelector('.hidden-answer');
    if(oldHidden)oldHidden.style.display='none';

    let box=panel.querySelector('.backup-technique');
    if(!box){
      box=document.createElement('div');
      box.className='backup-technique';
      panel.appendChild(box);
      renderBackup(box,key);
    }
    scheduleFit();
  }

  function fitStage(){
    stage.classList.remove('fit-compact','fit-tight');
    if(window.innerWidth<=620)return;
    requestAnimationFrame(()=>{
      if(stage.scrollHeight>stage.clientHeight+2){
        stage.classList.add('fit-compact');
        requestAnimationFrame(()=>{
          if(stage.scrollHeight>stage.clientHeight+2)stage.classList.add('fit-tight');
        });
      }
    });
  }

  function scheduleFit(){
    clearTimeout(fitTimer);
    fitTimer=setTimeout(fitStage,0);
  }

  stage.addEventListener('click',e=>{
    const b=e.target.closest('[data-backup-action]');
    if(!b)return;
    e.preventDefault();
    e.stopPropagation();
    const key=currentKey();
    const parts=BACKUP_PHRASES[key]||[];
    if(!parts.length)return;
    level=level>=parts.length?0:level+1;
    const box=stage.querySelector('.backup-technique');
    if(box)renderBackup(box,key);
  });

  const observer=new MutationObserver(()=>{
    requestAnimationFrame(syncBackup);
  });
  observer.observe(stage,{childList:true,subtree:true});
  window.addEventListener('resize',scheduleFit,{passive:true});
  syncBackup();
})();
</script>
